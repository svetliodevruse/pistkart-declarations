<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Формуляр за попълване | Картинг писта</title>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
  <style>
    html {
      overflow-y: scroll;
    }
    
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: Arial, sans-serif; 
    }
    
    body { 
      background-color: #0f0f10 !important; 
      color: #fff !important; 
      display: flex; 
      justify-content: center; 
      padding: 20px 15px !important; /* Абсолютно идентичен отстъп с index.html */
    }
    
    /* Изравняваме ширината точно с тази на index.html */
    .container { 
      width: 100%; 
      max-width: 440px !important; 
      background: transparent !important; 
      border: none !important; 
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 auto !important;
    }
    
    .header-box {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .brand-logo {
      max-width: 150px;
      height: auto;
      display: block;
      margin: 0 auto 12px auto !important;
    }

    .back-btn { 
      display: inline-block; 
      color: #ffc800; 
      text-decoration: none; 
      font-size: 12px; 
      font-weight: bold; 
      padding: 6px 14px; 
      background: #1a1a1e; 
      border: 1px solid #33333a; 
      border-radius: 6px; 
      margin-bottom: 15px;
      transition: all 0.2s ease-in-out;
    }

    .back-btn:hover { 
      background: #242429; 
      border-color: #ffc800; 
    }

    .brand-title { 
      color: #ffc800; 
      font-size: 20px; 
      font-weight: bold; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    p.subtitle { 
      color: #aaaaaa; 
      font-size: 13px; 
    }

    .section-head { 
      background: #1a1a1e; 
      padding: 11px 14px; 
      font-size: 13px; 
      font-weight: bold; 
      color: #ffc800; 
      border-left: 5px solid #e50914; 
      border-radius: 6px;
      margin: 20px 0 12px 0; 
      text-transform: uppercase;
      border-top: 1px solid #33333a;
      border-right: 1px solid #33333a;
      border-bottom: 1px solid #33333a;
    }
    
    .declaration-text-box {
      max-height: 220px;
      overflow-y: auto;
      background-color: #ffffff !important;
      color: #111111 !important;
      padding: 14px;
      border-radius: 8px;
      border: 2px solid #ffc800;
      margin-bottom: 15px;
      font-size: 12px;
      line-height: 1.5;
      -webkit-overflow-scrolling: touch;
    }
    .declaration-text-box * { color: #111111 !important; }
    .declaration-text-box ol, .declaration-text-box ul { padding-left: 20px; margin-top: 6px; }
    .declaration-text-box li { margin-bottom: 6px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; color: #dddddd; font-size: 13px; font-weight: bold; }
    label.req::after { content: " *"; color: #e50914; }
    input, select { 
      width: 100%; 
      padding: 12px; 
      background: #1a1a1e; 
      border: 1px solid #33333a; 
      border-radius: 8px; 
      color: #fff; 
      font-size: 15px; 
    }
    input:focus, select:focus {
      border-color: #ffc800;
      outline: none;
    }

    .canvas-wrapper { position: relative; width: 100%; height: 160px; background: #fff; border-radius: 8px; touch-action: none; margin-top: 5px; border: 2px solid #ffc800; }
    canvas { width: 100%; height: 100%; border-radius: 6px; }
    .signature-tools { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 22px 0; }
    .clear-btn { background: #1a1a1e; color: #ccc; border: 1px solid #33333a; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .clear-btn:hover { color: #fff; border-color: #e50914; }

    .submit-btn { 
      width: 100%; 
      background: linear-gradient(135deg, #e50914 0%, #b30000 100%); 
      color: #fff; 
      border: none; 
      padding: 16px; 
      font-size: 16px; 
      font-weight: bold; 
      border-radius: 8px; 
      cursor: pointer; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
    }
    .submit-btn:disabled { background: #555; box-shadow: none; }
    .group-row { display: flex; gap: 8px; margin-bottom: 8px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Шапка: Лого най-горе, бутон под него, заглавие и подзаглавие -->
    <div class="header-box">
      <img src="logo.png" alt="Pist Kart Extreme" class="brand-logo">
      <a href="index.html" class="back-btn">&#8592; Към началото</a>
      <h1 id="docTitle" class="brand-title">Декларация за безопасност</h1>
      <p class="subtitle">Попълнете данните на телефона си</p>
    </div>

    <form id="mainForm">
      
      <div class="section-head">Правила и условия (Запознаване)</div>
      <div class="declaration-text-box" id="declarationRulesView"></div>

      <div class="section-head">1. Данни за Декларатора / Водача</div>
      <div class="form-group"><label class="req">Трите имена</label><input type="text" id="fullName" required placeholder="Иван Иванов Иванов"></div>
      <div class="form-group"><label class="req">Дата на раждане</label><input type="date" id="birthDate" required min="1920-01-01"></div>
      <div class="form-group"><label>Адрес</label><input type="text" id="address" placeholder="гр. Русе, ул. Примерна 10"></div>
      <div class="form-group"><label>Телефон</label><input type="tel" id="phone" placeholder="0888 888 888"></div>
      <div class="form-group"><label>Имейл</label><input type="email" id="email" placeholder="ivan@example.com"></div>

      <div id="childFields" style="display: none;">
        <div class="section-head">2. Данни за дете / непълнолетен пилот</div>
        <div class="form-group"><label>Име на детето</label><input type="text" id="childName"></div>
        <div class="form-group"><label>Дата на раждане на детето</label><input type="date" id="childBirthDate"></div>
        <div class="form-group"><label>Адрес на детето</label><input type="text" id="childAddress"></div>
      </div>

      <div id="groupFields" style="display: none;">
        <div class="section-head">2. Допълнителни данни за групата</div>
        <div class="form-group"><label>Град / Държава</label><div style="display: flex; gap: 8px;"><input type="text" id="city" placeholder="Град"><input type="text" id="country" value="България"></div></div>
        <div class="form-group"><label class="req">В качеството си на</label>
          <select id="capacity"><option value="" disabled selected>-- Изберете --</option><option value="родител">родител</option><option value="организатор">организатор</option><option value="водач на групата">водач на групата</option></select>
        </div>
        <div class="section-head">3. Списък на участниците в групата</div>
        <div id="groupContainer"></div>
      </div>

      <div class="section-head">Подпис</div>
      <div class="canvas-wrapper"><canvas id="signatureCanvas"></canvas></div>
      <div class="signature-tools"><span style="font-size:11px; color:#888;">Подпишете с пръст</span><button type="button" class="clear-btn" id="clearBtn">Изчисти</button></div>
      <button type="submit" class="submit-btn" id="submitBtn">Потвърди и изпрати</button>
    </form>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxhZ1RppgkpBh0AhbNDojtX73UetLIs4Zbkt-Kx_if6FcxrI5HHOZeoxeNx2nKucuZs/exec"; 
    
    const urlParams = new URLSearchParams(window.location.search);
    const docType = urlParams.get('type') || 'initial_briefing';
    const todayStr = new Date().toISOString().split('T')[0];
    
    let rawPdfTemplate = "";

    document.getElementById('birthDate').max = todayStr;

    function formatDate(dStr) {
      if (!dStr) return "";
      const p = dStr.split("-");
      return p.length === 3 ? `${p[2]}.${p[1]}.${p[0]}` : dStr;
    }

    // ЧИСТИ ТЕКСТОВЕ С ПРАВИЛА ЗА ПРЕГЛЕД
    const rulesTextMap = {
      'initial_briefing': `
        <h3 style="margin-bottom:8px;">ПРАВИЛА И ИНСТРУКТАЖ ЗА БЕЗОПАСНОСТ</h3>
        <ol>
          <li>Във връзка с безопасността сесията/състезанието може да бъде прекратено, ако използвате едновременно газ и спирачка, умишлено удряте друг карт, излизате от трасето или слизате от карта по време на течаща сесия.</li>
          <li>При невъзможност за потегляне пилотът е длъжен да сигнализира с високо вдигната ръка и да изчака съдействие без да напуска карта.</li>
          <li>Задължително носете боне и предпазен шлем през цялото време.</li>
          <li>Не се носят отворени дрехи, които да се веят. Косата трябва да бъде прибрана под предпазния шлем.</li>
          <li>Длъжни сте да следвате всички инструкции на персонала на пистата.</li>
          <li>Участвате изцяло на своя отговорност за наранявания и имуществени вреди.</li>
          <li>Гарантирате, че се намирате в добро физическо и психическо здраве.</li>
          <li>Задвижващият механизъм е отзад вдясно – не го докосвайте поради риск от изгаряния.</li>
          <li>Забранено е управлението след употреба на алкохол, наркотици или с дъвка/бонбон в устата.</li>
        </ol>
      `,
      'gdpr': `
        <h3 style="margin-bottom:8px;">СЪГЛАСИЕ ЗА ОБРАБОТВАНЕ НА ЛИЧНИ ДАННИ (GDPR)</h3>
        <p>С потвърждаването на тази декларация се съгласявате със следните условия:</p>
        <ol>
          <li>Предоставяте доброволно личните си данни (и тези на детето си) за целите на предоставяне на картинг услуги и провеждане на инструктаж от „Пист Карт“ ЕООД.</li>
          <li>Информирани сте за правата си на достъп, коригиране, изтриване или ограничаване на обработването на личните ви данни.</li>
          <li>Информирани сте за правото да оттеглите съгласието си по всяко време.</li>
          <li>Информирани сте за правото на жалба до Комисията за защита на личните данни (КЗЛД).</li>
          <li>Предоставянето на личните данни е необходимо изискване за сключване на договора за картинг услуги.</li>
          <li>Декларацията се архивира по дата и се съхранява за законен срок от 5 години.</li>
        </ol>
      `,
      'groups': `
        <h3 style="margin-bottom:8px;">УСЛОВИЯ И ПРАВИЛА ЗА ГРУПИ ПИЛОТИ</h3>
        <ol>
          <li>Участниците в групата ще карат по своя воля и са запознати с рисковете от управлението на картинг.</li>
          <li>Давате съгласие за съхранение и обработка на личните данни на групата за срок до 10 години.</li>
          <li>Декларирате, че всички пилоти са в перфектно здраве и нямат претърпени тежки операции или заболявания.</li>
          <li>Всички пилоти са запознати с правилата за безопасност и светлинните знаци на пистата.</li>
          <li>Освобождавате от отговорност собствениците и служителите на пистата за инциденти, причинени от неспазване на правилата.</li>
          <li>Минималната възраст за каране от деца е 8 години (с минимална височина 130 см).</li>
        </ol>
      `
    };

    document.getElementById('declarationRulesView').innerHTML = rulesTextMap[docType] || rulesTextMap['initial_briefing'];

    fetch(`templates/declaration_${docType}.html`)
      .then(res => res.text())
      .then(html => { rawPdfTemplate = html; });

    function fillPdfTemplate(template, d) {
      let html = template;
      const signImg = d.signature ? `<img src="${d.signature}" style="height:50px; max-width:200px; display:inline-block;" />` : '';

      html = html.replace(/<\?!=\s*data\.signature\s*\?>/g, signImg);
      html = html.replace(/<\?=\s*formattedToday\s*\?>/g, formatDate(todayStr));
      html = html.replace(/<\?=\s*data\.fullName\s*\?>/g, d.fullName || '');
      html = html.replace(/<\?=\s*data\.birthDate\s*\?>/g, formatDate(d.birthDate) || '');
      html = html.replace(/<\?=\s*data\.address\s*\?>/g, d.address || '');
      html = html.replace(/<\?=\s*data\.phone\s*\?>/g, d.phone || '');
      html = html.replace(/<\?=\s*data\.email\s*\?>/g, d.email || '');
      html = html.replace(/<\?=\s*data\.childName\s*\?>/g, d.childName || '');
      html = html.replace(/<\?=\s*data\.childBirthDate\s*\?>/g, formatDate(d.childBirthDate) || '');
      html = html.replace(/<\?=\s*data\.childAddress\s*\?>/g, d.childAddress || '');
      html = html.replace(/<\?=\s*data\.city\s*\?>/g, d.city || '');
      html = html.replace(/<\?=\s*data\.country\s*\?>/g, d.country || '');
      html = html.replace(/<\?=\s*data\.capacity\s*\?>/g, d.capacity || '');

      html = html.replace(/<\?\s*if\s*\(data\.signature\)\s*\{\s*\?>/g, '');
      html = html.replace(/<\?\s*\}\s*\?>/g, '');

      if (docType === 'groups') {
        let tableRows = "";
        if (d.groupMembers && d.groupMembers.length) {
          d.groupMembers.forEach((m, idx) => {
            tableRows += `<tr><td style="text-align:center;">${idx + 1}.</td><td><strong>${m.name}</strong> ${m.birth ? `(Дата на раждане: ${formatDate(m.birth)})` : ''}</td></tr>`;
          });
        } else {
          for (let i = 1; i <= 10; i++) {
            tableRows += `<tr><td style="text-align:center;">${i}.</td><td></td></tr>`;
          }
        }
        html = html.replace(/<tbody>[\s\S]*?<\/tbody>/gi, `<tbody>${tableRows}</tbody>`);
      }

      return html;
    }

    if (docType === 'initial_briefing') {
      document.getElementById('docTitle').innerText = "Първоначален инструктаж";
      document.getElementById('childFields').style.display = 'block';
    } else if (docType === 'gdpr') {
      document.getElementById('docTitle').innerText = "Декларация - съгласие";
      document.getElementById('childFields').style.display = 'block';
    } else if (docType === 'groups') {
      document.getElementById('docTitle').innerText = "Декларация за Група Пилоти";
      document.getElementById('groupFields').style.display = 'block';
      const groupContainer = document.getElementById('groupContainer');
      for (let i = 1; i <= 10; i++) {
        groupContainer.innerHTML += `<div class="group-row"><span style="font-size:12px; padding-top:8px;">${i}.</span><input type="text" class="g-name" placeholder="Име ${i}"><input type="date" class="g-birth" style="width:140px;" max="${todayStr}"></div>`;
      }
    }

    const canvas = document.getElementById('signatureCanvas');
    const signaturePad = new SignaturePad(canvas, { backgroundColor: 'rgb(255, 255, 255)' });

    function resizeCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    document.getElementById('clearBtn').addEventListener('click', () => signaturePad.clear());

    document.getElementById('mainForm').addEventListener('submit', function(e) {
      e.preventDefault();
      if (signaturePad.isEmpty()) { alert("Моля, положете вашия подпис!"); return; }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "Генериране на PDF...";

      let groupMembers = [];
      if (docType === 'groups') {
        const names = document.querySelectorAll('.g-name');
        const births = document.querySelectorAll('.g-birth');
        names.forEach((el, index) => {
          if (el.value.trim() !== '') groupMembers.push({ name: el.value.trim(), birth: births[index].value });
        });
      }

      const formData = {
        fullName: document.getElementById('fullName').value,
        birthDate: document.getElementById('birthDate').value,
        address: document.getElementById('address').value,
        phone: document.getElementById('phone').value,
        email: document.getElementById('email').value,
        childName: document.getElementById('childName') ? document.getElementById('childName').value : '',
        childBirthDate: document.getElementById('childBirthDate') ? document.getElementById('childBirthDate').value : '',
        childAddress: document.getElementById('childAddress') ? document.getElementById('childAddress').value : '',
        city: document.getElementById('city') ? document.getElementById('city').value : '',
        country: document.getElementById('country') ? document.getElementById('country').value : '',
        capacity: document.getElementById('capacity') ? document.getElementById('capacity').value : '',
        groupMembers: groupMembers,
        signature: signaturePad.toDataURL()
      };

      const fullHtmlForPdf = fillPdfTemplate(rawPdfTemplate, formData);

      fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          type: docType,
          fullName: formData.fullName,
          htmlContent: fullHtmlForPdf
        })
      })
      .then(res => res.json())
      .then(response => {
        if (response.status === "success") {
          sessionStorage.setItem('pdfDownloadUrl', response.fileUrl);
          window.location.href = "success.html";
        } else {
          alert("Грешка: " + response.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Потвърди и изпрати";
        }
      })
      .catch(err => {
        alert("Грешка при връзката със сървъра: " + err);
        submitBtn.disabled = false;
        submitBtn.innerText = "Потвърди и изпрати";
      });
    });
  </script>
</body>
</html>
